<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0085ca" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <title>仙台空港アクセス線 運行状況＆駅ガイド</title>
    <style>
      :where(html, body) { background-color: #f7f7f7; color: #0f172a; }
      :where(html.dark, html.dark body) { background-color: #09090b; color: #f8fafc; color-scheme: dark; }
    </style>
    <script>
      try {
        var s = localStorage.getItem('saal-theme');
        var d = s === 'dark' || (s !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        var r = document.documentElement;
        r.classList.add(d ? 'dark' : 'light');
        r.setAttribute('data-theme', d ? 'dark' : 'light');
        r.setAttribute('data-mantine-color-scheme', d ? 'dark' : 'light');
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=BIZ+UDPGothic:wght@400;700&family=DotGothic16&family=Hind:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=M+PLUS+1:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  </head>
  <body class="antialiased selection:bg-saal-blue selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
